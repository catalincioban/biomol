function buildModel(p, small) {

  for (const r of residues) {

    if (WATER.has(r.resn)) r.kind = 'water';
    else if (names.has('CA') && names.has('N') && names.has('C') && !small) r.kind = 'protein';
    else if (!small && (NUC[r.resn] || (names.has("C1'") && (names.has('P') || names.has("C4'")) && names.has("C4'")))) r.kind = 'nucleic';
    else if (r.atoms.length === 1 && atoms[r.atoms[0]].el !== 'C' && !small) r.kind = 'ion';
    else r.kind = 'ligand';
    r.ss = r.kind === 'protein' ? 'C' : (r.kind === 'nucleic' ? 'N' : '-');
    for (const i of r.atoms) { atoms[i].kind = r.kind; }
    if (r.kind === 'protein') { r.ca = r.atoms.find(i => atoms[i].name === 'CA'); r.o = r.atoms.find(i => atoms[i].name === 'O'); }
    if (r.kind === 'nucleic') { r.p = r.atoms.find(i => atoms[i].name === 'P'); r.c4 = r.atoms.find(i => atoms[i].name === "C4'"); }
  }

  for (const [c, s, c2, e] of p.sheet) for (const r of residues) if (r.kind === 'protein' && r.chain === c && r.resi >= s && r.resi <= e) r.ss = 'E';

  for (const r of residues) if (r.kind !== 'water' && !chainSet.has(r.chain)) { chainSet.add(r.chain); chains.push(r.chain); }

      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
        const b = grid.get(k3(cx + dx, cy + dy, cz + dz)); if (!b) continue;
